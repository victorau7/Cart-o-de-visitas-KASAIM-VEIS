<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6500ee">
  <meta name="description" content="Perfil de contato imobiliaria Kasa Imóveis">
  <title>Kasa Imóveis</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./script.js" defer></script>
  
  <style>
    /* Ajustes do Cartão, Avatar e Espaçamentos */
    .profile-card {
      padding-top: 100px !important; 
      margin-bottom: 32px !important; 
    }
    
    .avatar {
      width: 160px !important; 
      height: 160px !important;
      top: -80px !important; 
    }

    /* Garante que o fundo de todos os links seja branco */
    .profile-link {
      background: #ffffff !important;
    }

    /* Cores Tradicionais das Marcas e Ícones */
    .link-whatsapp svg,
    .link-phone svg {
      color: #25D366 !important; /* Verde tradicional */
    }
    
    .link-instagram svg {
      color: #E1306C !important; /* Rosa/Magenta tradicional do Instagram */
    }

    .link-address svg {
      color: #4285F4 !important; /* Azul padrão do Google Maps */
    }

    .link-email svg {
      color: #EA4335 !important; /* Vermelho padrão Google/Gmail */
    }

    /* Garante que os ícones coloridos fiquem brancos ao passar o mouse */
    .profile-link:hover.link-whatsapp svg,
    .profile-link:hover.link-instagram svg,
    .profile-link:hover.link-phone svg,
    .profile-link:hover.link-address svg,
    .profile-link:hover.link-email svg {
      color: #ffffff !important;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="profile-column">
      
      <!-- Início do Cartão Principal -->
      <section class="profile-card" aria-labelledby="profile-name">
        <button class="share-button" id="share-button" type="button" aria-label="Compartilhar este perfil">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="18" cy="5" r="3"></circle>
            <circle cx="6" cy="12" r="3"></circle>
            <circle cx="18" cy="19" r="3"></circle>
            <path d="m8.7 10.7 6.6-4.4M8.7 13.3l6.6 4.4"></path>
          </svg>
        </button>

        <div class="avatar">
          <img src="imagens/foto.png" alt="Foto de perfil">
        </div>

        <h1 id="profile-name">KASA IMÓVEIS</h1>
        <a class="save-contact" href="./kasaimoveis.vcf" download>Salvar na agenda</a>
      </section>

      <!-- Lista de Contatos (Todos os botões estão aqui dentro para manterem o mesmo alinhamento e afastamento) -->
      <nav class="links-list" aria-label="Links de contato">
        
        <a class="profile-link link-whatsapp" href="https://api.whatsapp.com/send?phone=5527999591249" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.2 11.7a8.2 8.2 0 0 1-12.1 7.2L4 20l1.2-4a8.2 8.2 0 1 1 15-4.3Z"></path>
            <path d="M9 8.5c.2-.4.5-.4.8-.4h.4c.2 0 .3.1.4.4l.7 1.7c.1.2.1.4-.1.6l-.5.6c-.2.2-.2.4 0 .6.5.9 1.2 1.6 2.1 2.1.2.1.4.1.6-.1l.7-.8c.2-.2.4-.2.6-.1l1.6.8c.2.1.3.2.3.4 0 .3-.2 1.1-.7 1.5-.5.5-1.3.7-2 .5-1.1-.2-2.5-.9-3.8-2.1-1-.9-1.8-2.1-2-3.1-.2-.9 0-1.8.5-2.6Z"></path>
          </svg>
          <span>WhatsApp</span>
        </a>

        <a class="profile-link link-instagram" href="https://www.instagram.com/kasaimoveis.vix?rpxt=MWozcXkwN3ljZzFtZA==" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3.5" y="3.5" width="17" height="17" rx="4.5"></rect>
            <circle cx="12" cy="12" r="4"></circle>
            <circle class="icon-fill" cx="17.7" cy="6.5" r="1"></circle>
          </svg>
          <span>Instagram</span>
        </a>

        <a class="profile-link link-phone" href="tel:2733144001">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 3.5h3l1.4 4.1-2 1.7a15.2 15.2 0 0 0 5.3 5.3l1.7-2 4.1 1.4v3c0 1.1-.9 2-2 2C10.2 19 5 13.8 5 7.5c0-1.1.9-2 2-2Z"></path>
          </svg>
          <span>Telefone</span>
        </a> 
          
        <a class="profile-link" href="http://www.kasaimoveis.com/" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          <span>Site</span>
        </a>

        <a class="profile-link link-address" href="https://maps.app.goo.gl/aNwutNmrtShPmbG37" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19 10.2c0 5-7 10.3-7 10.3S5 15.2 5 10.2a7 7 0 1 1 14 0Z"></path>
            <circle cx="12" cy="10" r="2.3"></circle>
          </svg>
          <span>Endereço / Localização</span>
        </a>

        <a class="profile-link link-email" href="mailto:kasa@kasaimoveis.com">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2"></rect>
            <path d="M3 7l9 6 9-6"></path>
          </svg>
          <span>E-mail</span>
        </a>
        
      </nav>
      <p class="share-status" id="share-status" aria-live="polite"></p>
    </div>
  </main>
</body>
</html>
