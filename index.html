<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d0d0d">
  <meta name="description" content="Perfil de contato imobiliaria Kasa Imóveis">
  <title>Kasa Imóveis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="./styles.css">
  <script src="./script.js" defer></script>
</head>
<body>
  <!-- Gradiente usado no ícone do Instagram -->
  <svg class="svg-defs" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="ig-gradient" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="#feda75"></stop>
        <stop offset="0.3" stop-color="#fa7e1e"></stop>
        <stop offset="0.6" stop-color="#d62976"></stop>
        <stop offset="1" stop-color="#4f5bd5"></stop>
      </linearGradient>
    </defs>
  </svg>

  <main class="page">
    <div class="profile-column">

      <!-- Cartão principal -->
      <section class="profile-card" aria-labelledby="profile-name">
        <button class="share-button" id="share-button" type="button" aria-label="Compartilhar este perfil">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="18" cy="5" r="3"></circle>
            <circle cx="6" cy="12" r="3"></circle>
            <circle cx="18" cy="19" r="3"></circle>
            <path d="m8.7 10.7 6.6-4.4M8.7 13.3l6.6 4.4"></path>
          </svg>
        </button>

        <div class="avatar">
          <img src="imagens/foto.png" alt="Logotipo Kasa Imóveis">
        </div>

        <h1 id="profile-name">Kasa <span>Imóveis</span></h1>

        <a class="save-contact" href="./kasaimoveis.vcf" download>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3.5" y="5" width="17" height="15.5" rx="2.5"></rect>
            <path d="M3.5 10h17M8 3v4M16 3v4"></path>
            <path d="M8 14h.01M12 14h.01M16 14h.01M8 17.5h.01M12 17.5h.01" stroke-width="2.2"></path>
          </svg>
          <span>Salvar na agenda</span>
        </a>
      </section>

      <!-- Lista de contatos -->
      <nav class="links-list" aria-label="Links de contato">

        <a class="profile-link link-whatsapp" href="https://api.whatsapp.com/send?phone=5527999591249" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.2 11.7a8.2 8.2 0 0 1-12.1 7.2L4 20l1.2-4a8.2 8.2 0 1 1 15-4.3Z"></path>
            <path d="M9 8.5c.2-.4.5-.4.8-.4h.4c.2 0 .3.1.4.4l.7 1.7c.1.2.1.4-.1.6l-.5.6c-.2.2-.2.4 0 .6.5.9 1.2 1.6 2.1 2.1.2.1.4.1.6-.1l.7-.8c.2-.2.4-.2.6-.1l1.6.8c.2.1.3.2.3.4 0 .3-.2 1.1-.7 1.5-.5.5-1.3.7-2 .5-1.1-.2-2.5-.9-3.8-2.1-1-.9-1.8-2.1-2-3.1-.2-.9 0-1.8.5-2.6Z"></path>
          </svg>
          <span>WhatsApp</span>
        </a>

        <a class="profile-link link-instagram" href="https://www.instagram.com/kasaimoveis.vix?rpxt=MWozcXkwN3ljZzFtZA==" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3.5" y="3.5" width="17" height="17" rx="4.5"></rect>
            <circle cx="12" cy="12" r="4"></circle>
            <circle class="icon-fill" cx="17.7" cy="6.5" r="1"></circle>
          </svg>
          <span>Instagram</span>
        </a>

        <a class="profile-link link-phone" href="tel:02733144001">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 3.5h3l1.4 4.1-2 1.7a15.2 15.2 0 0 0 5.3 5.3l1.7-2 4.1 1.4v3c0 1.1-.9 2-2 2C10.2 19 5 13.8 5 7.5c0-1.1.9-2 2-2Z"></path>
          </svg>
          <span>Telefone</span>
        </a>

        <a class="profile-link link-site" href="http://www.kasaimoveis.com/" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          <span>Site</span>
        </a>

        <a class="profile-link link-address" href="https://maps.app.goo.gl/aNwutNmrtShPmbG37" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19 10.2c0 5-7 10.3-7 10.3S5 15.2 5 10.2a7 7 0 1 1 14 0Z"></path>
            <circle cx="12" cy="10" r="2.3"></circle>
          </svg>
          <span>Endereço</span>
        </a>

        <a class="profile-link link-email" href="mailto:kasa@kasaimoveis.com">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2"></rect>
            <path d="M3 7l9 6 9-6"></path>
          </svg>
          <span>E-mail</span>
        </a>

      </nav>

      <p class="share-status" id="share-status" aria-live="polite"></p>

      <!-- Rodapé -->
      <footer class="footer-brand">
        <div class="footer-divider">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 20V10.5L12 4l8 6.5V20"></path>
          </svg>
        </div>
        <p>Realizando sonhos</p>
      </footer>

    </div>
  </main>
</body>
</html>
